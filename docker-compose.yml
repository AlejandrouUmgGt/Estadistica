version: '3.8'

networks:
  proyecto-net:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proyecto-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    networks:
      - proyecto-net

  nginx:
    image: nginx:stable-alpine
    container_name: proyecto-nginx
    restart: unless-stopped
    ports:
      # Solo loopback: el acceso público entra por el Nginx HTTPS del VPS.
      - "127.0.0.1:8089:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - proyecto-net