server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.html;
    autoindex off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # CAMBIO: nunca permitir que el navegador lea archivos internos del proyecto.
    location ~ /\. {
        return 404;
    }

    location = /Dockerfile { return 404; }
    location = /docker-compose.yml { return 404; }
    location ^~ /docker/ { return 404; }
    location = /README.md { return 404; }

    # CAMBIO: la entrada pública es el HTML de la primera pantalla.
    location = / {
        try_files /HTML/index.html =404;
    }

    location = /index.html {
        try_files /HTML/index.html =404;
    }

    # CAMBIO: se eliminaron las maquetas HTML duplicadas; se usan /resultados y /historial.

    # CAMBIO: archivos públicos que necesita el navegador.
    location ^~ /CSS/ {
        try_files $uri =404;
    }

    location ^~ /JAVASCRIPT/ {
        try_files $uri =404;
    }

    # CAMBIO: rutas públicas que ejecutan PHP sin exponer la ruta del archivo.
    location = /resultados {
        # CAMBIO: solo muestra la pantalla; JavaScript llama las APIs.
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/PHP/resultados.php;
        fastcgi_param SCRIPT_NAME /PHP/resultados.php;
        fastcgi_param PHP_VALUE "display_errors=Off\nlog_errors=On\nerror_reporting=E_ALL\ndate.timezone=America/Guatemala";
    }

    location = /historial {
        # CAMBIO: solo muestra la pantalla; JavaScript llama la API de Diego.
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/PHP/historial.php;
        fastcgi_param SCRIPT_NAME /PHP/historial.php;
        fastcgi_param PHP_VALUE "display_errors=Off\nlog_errors=On\nerror_reporting=E_ALL\ndate.timezone=America/Guatemala";
    }

    # CAMBIO: cada compañero tiene una ruta pública independiente.
    location = /api/joel-adrian-galego-lopez {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/PHP/JoelAdrianGalegoLopez.php;
        fastcgi_param SCRIPT_NAME /PHP/JoelAdrianGalegoLopez.php;
        fastcgi_param PHP_VALUE "display_errors=Off\nlog_errors=On\nerror_reporting=E_ALL\ndate.timezone=America/Guatemala";
    }

    location = /api/obdulio-augusto-fuentes-fuentes {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/PHP/ObdulioAugustoFuentesFuentes.php;
        fastcgi_param SCRIPT_NAME /PHP/ObdulioAugustoFuentesFuentes.php;
        fastcgi_param PHP_VALUE "display_errors=Off\nlog_errors=On\nerror_reporting=E_ALL\ndate.timezone=America/Guatemala";
    }

    location = /api/william-eliazar-mateo-devian {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/PHP/WilliamEliazarMateoDevian.php;
        fastcgi_param SCRIPT_NAME /PHP/WilliamEliazarMateoDevian.php;
        fastcgi_param PHP_VALUE "display_errors=Off\nlog_errors=On\nerror_reporting=E_ALL\ndate.timezone=America/Guatemala";
    }

    location = /api/diego-alejandro-vasquez-yol {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/PHP/DiegoAlejandroVasquezYol.php;
        fastcgi_param SCRIPT_NAME /PHP/DiegoAlejandroVasquezYol.php;
        fastcgi_param PHP_VALUE "display_errors=Off\nlog_errors=On\nerror_reporting=E_ALL\ndate.timezone=America/Guatemala";
    }

    # CAMBIO: no se puede abrir un archivo PHP escribiendo su dirección.
    location ~ \.php(?:/|$) {
        return 404;
    }

    # CAMBIO: solamente permitimos rutas públicas conocidas.
    location / {
        return 404;
    }
}